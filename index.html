<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅記">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>旅記 Trip Notes</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* ================= 外觀設定（改這裡就能調整整個 app） =================
   顏色：用色碼，例如 #0f766e。可以到 https://htmlcolorcodes.com 挑。
   大小：--font-size 是全站基準字級，其他文字、按鈕、間距都會跟著等比例縮放。
   App 內「設定 > 外觀」也可以直接調，調的結果會蓋過這裡的預設值。 */
:root{
  /* 字級與形狀 */
  --font-size:15px;        /* 基準字級（建議 13–19px） */
  --radius:10px;           /* 卡片、按鈕的圓角（0 = 直角） */
  --gutter:16px;           /* 畫面左右留白 */
  --font:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;

  /* 淺色模式顏色 */
  --bg:#f6f5f2;            /* 背景 */
  --card:#ffffff;          /* 卡片、輸入框底色 */
  --ink:#1f2328;           /* 主要文字 */
  --muted:#6b7078;         /* 次要文字 */
  --line:#e4e2dd;          /* 框線 */
  --accent:#e37a16;        /* 主色（按鈕、選取中的分頁） */
  --accent-ink:#ffffff;    /* 主色按鈕上的文字 */
  --danger:#b42318;        /* 刪除等警示 */

  /* 類別顏色（地圖標記與列表圓點） */
  --c-food:#d9480f;--c-hotel:#5f3dc4;--c-sight:#1971c2;--c-shop:#c2255c;--c-other:#495057;
}
/* 深色模式顏色（跟隨系統，或在 app 內指定） */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121417;--card:#1c1f24;--ink:#e8e6e3;--muted:#9aa0a6;--line:#2c3036;--accent:#e37a16;--accent-ink:#ffffff;
  }
}
:root[data-theme="dark"]{
  --bg:#121417;--card:#1c1f24;--ink:#e8e6e3;--muted:#9aa0a6;--line:#2c3036;--accent:#e37a16;--accent-ink:#ffffff;
}
/* ================= 以下為版面結構，一般不需要改 ================= */
html{font-size:var(--font-size)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:1rem/1.5 var(--font);-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:500;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) var(--gutter) 8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
header h1{font-size:1.2rem;margin:0;flex:1}
main{padding:12px var(--gutter) calc(80px + env(safe-area-inset-bottom));max-width:820px;margin:0 auto}
/* 選單：手機＝底部分頁列；寬螢幕（iPad、電腦、手機橫放）＝左側可收合側欄。
   「只顯示圖示」時文字淡出，主內容同步變寬（手機則是分頁列變矮）。 */
:root{--side-w:212px;--side-mini:calc(68px + env(safe-area-inset-left));--nav-ease:cubic-bezier(.6,0,.2,1);--nav-t:.45s}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:600;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;border-radius:0;background:none;color:var(--muted);padding:8px 0 6px;font-size:.72rem;flex-direction:column;justify-content:center;gap:2px;transition:padding var(--nav-t) var(--nav-ease),background-color .2s}
nav.tabs button.on{color:var(--accent);font-weight:600}
nav.tabs .ico{width:24px;height:24px;flex:none}
nav.tabs .lbl{display:block;white-space:nowrap;overflow:hidden;max-height:1.5em;line-height:1.5;transition:opacity .3s var(--nav-ease),transform var(--nav-t) var(--nav-ease),max-height var(--nav-t) var(--nav-ease)}
nav.tabs .side-toggle{display:none}
html.nav-mini nav.tabs button{padding:11px 0 9px}
html.nav-mini nav.tabs .lbl{opacity:0;max-height:0;transform:translateY(6px)}
@media (min-width:768px){
  html{--nav-w:var(--side-w)}
  html.nav-mini{--nav-w:var(--side-mini)}
  body{padding-left:var(--nav-w);transition:padding-left var(--nav-t) var(--nav-ease)}
  nav.tabs{top:0;right:auto;width:var(--nav-w);flex-direction:column;gap:4px;overflow:hidden;border-top:0;border-right:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 16px) calc(10px + env(safe-area-inset-left));transition:width var(--nav-t) var(--nav-ease)}
  nav.tabs button,html.nav-mini nav.tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:14px;padding:10px 12px;font-size:.95rem;border-radius:var(--radius)}
  nav.tabs button:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
  nav.tabs button.on{background:color-mix(in srgb,var(--accent) 13%,transparent)}
  nav.tabs .lbl{max-height:none}
  html.nav-mini nav.tabs .lbl{opacity:0;max-height:none;transform:translateX(-10px)}
  nav.tabs .side-toggle{display:flex;margin-bottom:10px;font-weight:400}
  main{padding-bottom:calc(32px + env(safe-area-inset-bottom))}
  .toast{bottom:28px!important;left:calc(50% + var(--nav-w) / 2)!important}
}
@media (prefers-reduced-motion:reduce){:root{--nav-t:0s}nav.tabs .lbl{transition:none}}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--radius);padding:7px 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.btn.primary,button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.sm,.btn.sm{padding:4px 9px;font-size:0.867rem;border-radius:calc(var(--radius) * .8)}
button.danger{color:var(--danger)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:0.867rem;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.grow{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chip{white-space:nowrap;border-radius:999px;padding:4px 12px;font-size:0.867rem}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:calc(var(--radius) * 1.4);padding:12px;margin:8px 0}
.place{display:flex;gap:10px;align-items:flex-start}
.dot{width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.9rem;font-weight:600;flex:none}
.place .info{flex:1;min-width:0}
.place .name,.prow .name{font-weight:600;overflow-wrap:anywhere}
.prow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .info{flex:1;min-width:0;cursor:pointer}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot.sm{width:1.8rem;height:1.8rem;font-size:.8rem}
[data-focus]{cursor:pointer}
.seg{display:inline-flex}.seg button{border-radius:0}.seg button:first-child{border-radius:calc(var(--radius) * .8) 0 0 calc(var(--radius) * .8)}.seg button:last-child{border-radius:0 calc(var(--radius) * .8) calc(var(--radius) * .8) 0;margin-left:-1px}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.listmap{position:sticky;top:calc(env(safe-area-inset-top) + 52px);z-index:400;height:36vh}
.hl{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--radius)}
.meta{color:var(--muted);font-size:0.867rem;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:0.733rem;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin:2px 4px 0 0;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
#bigmap{height:calc(100vh - 210px);min-height:320px;border-radius:calc(var(--radius) * 1.4);border:1px solid var(--line)}
.tripmap{height:260px;border-radius:calc(var(--radius) * 1.4);border:1px solid var(--line);margin:8px 0}
h2{font-size:1.13rem;margin:14px 0 6px}
h3{font-size:1rem;margin:10px 0 4px}
.stop{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.stop:first-child{border-top:0}
.num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:0.8rem;font-weight:700;flex:none}
.leg{font-size:0.8rem;color:var(--muted);padding-left:32px}
dialog{border:0;border-radius:calc(var(--radius) * 1.6);padding:0;width:min(560px,calc(100vw - 24px));max-height:88vh;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog .body{padding:16px;overflow:auto;max-height:calc(88vh - 60px)}
dialog .foot{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line)}
.pick{display:flex;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
.pick input{width:auto}
.hint{font-size:0.867rem;color:var(--muted);background:var(--bg);border-radius:var(--radius);padding:10px 12px;margin:8px 0}
.hint ol{margin:4px 0;padding-left:20px}
iframe.mymap{width:100%;height:420px;border:1px solid var(--line);border-radius:calc(var(--radius) * 1.4)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:var(--radius);z-index:2000;font-size:0.933rem;max-width:90vw}
.daytabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0}
select.sm{padding:4px 8px;font-size:0.867rem;border-radius:calc(var(--radius) * .8)}
[data-go]{cursor:pointer}
.thumb{display:block;width:100%;max-height:240px;object-fit:cover;border-radius:var(--radius);margin:0 0 8px;background:var(--line)}
.trow{display:flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--radius)}
.trow.on{background:var(--accent);color:var(--accent-ink)}
.trow.on .tag{color:var(--accent-ink)!important;border-color:var(--accent-ink)!important}
.trow .tog{border:0;background:none;color:inherit;width:2rem;padding:8px 0;justify-content:center}
.trow .tname{flex:1;padding:9px 4px;cursor:pointer}
a[data-go]{color:var(--accent)}
</style>
</head>
<body>
<header><h1 id="title">旅記</h1><span id="headActions"></span></header>
<main id="view"></main>
<nav class="tabs">
  <button class="side-toggle" id="navToggle" aria-label="收合選單" title="收合選單"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/><path d="M15.5 10l-2 2 2 2"/></svg><span class="lbl">收合選單</span></button>
  <button data-tab="inbox" title="收藏"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.5h10a1 1 0 0 1 1 1V21l-6-4-6 4V4.5a1 1 0 0 1 1-1z"/></svg><span class="lbl">收藏</span></button>
  <button data-tab="places" title="地點"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg><span class="lbl">地點</span></button>
  <button data-tab="map" title="地圖"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6z"/><path d="M9 4v14M15 6v14"/></svg><span class="lbl">地圖</span></button>
  <button data-tab="trips" title="行程"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span class="lbl">行程</span></button>
  <button data-tab="import" title="設定"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span class="lbl">設定</span></button>
</nav>
<dialog id="dlg"></dialog>

<script>
// ---------- data ----------
const KEY='tripnote.v1';
const CATS={food:{n:'餐廳',i:'餐',c:'var(--c-food)'},hotel:{n:'住宿',i:'宿',c:'var(--c-hotel)'},sight:{n:'景點',i:'景',c:'var(--c-sight)'},shop:{n:'購物',i:'購',c:'var(--c-shop)'},other:{n:'其他',i:'他',c:'var(--c-other)'}};
let db=load();
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.places)return Object.assign({trips:[],mymaps:[]},d)}catch(e){}return{places:[],trips:[],mymaps:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('儲存失敗：'+e.message)}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=id=>db.places.find(p=>p.id===id);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

// ---------- Google Maps link parsing ----------
function parseGmaps(url){
  const r={url:url.trim()};
  let m;
  if((m=url.match(/\/maps\/place\/([^/@?]+)/)))r.name=decodeURIComponent(m[1].replace(/\+/g,' '));
  if((m=url.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/))){r.lat=+m[1];r.lng=+m[2]}
  else if((m=url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/))){r.lat=+m[1];r.lng=+m[2]}
  else if((m=url.match(/[?&](?:q|query|ll|destination)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/))){r.lat=+m[1];r.lng=+m[2]}
  else if((m=url.match(/\/search\/(-?\d+\.\d+),\s*\+?(-?\d+\.\d+)/))){r.lat=+m[1];r.lng=+m[2]}
  if(!r.name&&(m=url.match(/[?&](?:q|query)=([^&]+)/))){const q=decodeURIComponent(m[1].replace(/\+/g,' '));if(!/^-?\d+\.\d+,/.test(q))r.name=q}
  return r;
}
function gmapsLink(p){
  if(p.url&&/google\.|goo\.gl/.test(p.url))return p.url;
  if(p.lat!=null)return `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name+' '+(p.address||''))}`;
}
async function geocode(q){
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=zh-TW&q='+encodeURIComponent(q));
  const j=await r.json();if(!j.length)return null;
  return{lat:+j[0].lat,lng:+j[0].lon,address:j[0].display_name};
}
function guessCat(t){
  t=(t||'').toLowerCase();
  if(/hotel|hostel|\binn\b|resort|飯店|酒店|旅館|民宿|ホテル|ゲストハウス/.test(t))return'hotel';
  if(/restaurant|cafe|coffee|bar|ramen|sushi|餐|食|麵|咖啡|居酒屋|料理|燒肉|拉麵|甜點|カフェ|食堂|寿司/.test(t))return'food';
  if(/mall|store|shop|market|百貨|商店|市場|購物|outlet|drugstore|藥妝/.test(t))return'shop';
  if(/temple|shrine|-dera|-ji\b|jinja|park|museum|tower|castle|寺|神社|公園|博物館|美術館|塔|城|景|山|湖|海灘|老街/.test(t))return'sight';
  return'other';
}

// ---------- routing ----------
let tab='places',filt={cat:'all',q:'',tag:'all'},openTrip=null,openDay=0,leaf=null;
document.querySelectorAll('nav.tabs button[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;openTrip=null;render()});
// 選單收合（記住上次的狀態）
const NAV_KEY='tripnote.nav';
function setNavMini(on,save=true){
  document.documentElement.classList.toggle('nav-mini',on);
  const t=document.getElementById('navToggle'),l=on?'展開選單':'收合選單';
  t.title=l;t.setAttribute('aria-label',l);t.setAttribute('aria-expanded',String(!on));t.querySelector('.lbl').textContent=l;
  if(save)try{localStorage.setItem(NAV_KEY,on?'mini':'full')}catch(e){}
}
try{setNavMini(localStorage.getItem(NAV_KEY)==='mini',false)}catch(e){setNavMini(false,false)}
document.getElementById('navToggle').onclick=()=>setNavMini(!document.documentElement.classList.contains('nav-mini'));
document.querySelector('nav.tabs').addEventListener('transitionend',e=>{if(leaf&&e.target===e.currentTarget)leaf.invalidateSize()});
function render(){
  document.querySelectorAll('nav.tabs button[data-tab]').forEach(b=>{b.classList.toggle('on',b.dataset.tab===tab);b.toggleAttribute('aria-current',b.dataset.tab===tab)});
  if(leaf){leaf.remove();leaf=null}
  document.getElementById('headActions').innerHTML='';
  ({inbox:renderInbox,places:renderPlaces,map:renderMap,trips:renderTrips,import:renderImport})[tab]();
  window.scrollTo(0,0);
}
const V=()=>document.getElementById('view');
const setTitle=(t,actions='')=>{document.getElementById('title').textContent=t;document.getElementById('headActions').innerHTML=actions};
function allTags(){const s=new Set();db.places.forEach(p=>(p.tags||[]).forEach(t=>s.add(t)));return[...s].sort()}
function filtered(){
  const q=filt.q.trim().toLowerCase();
  return db.places.filter(p=>(filt.cat==='all'||p.cat===filt.cat)&&(filt.tag==='all'||(p.tags||[]).includes(filt.tag))&&
    (!q||[p.name,p.address,p.note,(p.tags||[]).join(' ')].join(' ').toLowerCase().includes(q)));
}
function filterBar(){
  const tags=allTags();
  return `<div class="row"><input class="grow" id="q" placeholder="搜尋名稱、地址、筆記…" value="${esc(filt.q)}">
  ${tags.length?`<select id="tagSel" style="width:auto;max-width:40%"><option value="all">全部清單</option>${tags.map(t=>`<option ${filt.tag===t?'selected':''}>${esc(t)}</option>`).join('')}</select>`:''}</div>
  <div class="chips">${[['all','全部']].concat(Object.entries(CATS).map(([k,v])=>[k,v.n])).map(([k,n])=>`<button class="chip ${filt.cat===k?'on':''}" data-cat="${k}">${n}</button>`).join('')}</div>`;
}
function bindFilter(re){
  const q=document.getElementById('q');q.oninput=()=>{filt.q=q.value;re(true)};
  const ts=document.getElementById('tagSel');if(ts)ts.onchange=()=>{filt.tag=ts.value;re()};

function dist(a,b){const R=6371,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLn=(b.lng-a.lng)*r;const h=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function renderTrips(){
  if(openTrip)return renderTrip();
  setTitle('我的行程',`<button class="primary sm" id="newTrip">＋ 新行程</button>`);
  document.getElementById('newTrip').onclick=()=>{const n=prompt('行程名稱（例如：京都 5 天）');if(!n)return;const days=parseInt(prompt('幾天？','3'))||1;
    const t={id:uid(),name:n,start:'',days:Array.from({length:days},()=>({stops:[],note:''}))};db.trips.unshift(t);save();openTrip=t.id;openDay=0;render()};

    <div class="meta">${t.start?esc(t.start)+' 起 · ':''}${t.days.length} 天 · ${t.days.reduce((a,d)=>a+d.stops.length,0)} 個停留點</div></div>`).join('')
    :'<div class="empty">還沒有行程。點右上「＋ 新行程」開始排。</div>';

}
function dayDate(t,i){if(!t.start)return'';const d=new Date(t.start);d.setDate(d.getDate()+i);return `${d.getMonth()+1}/${d.getDate()}`}

function pickStops(day){

  <div class="foot"><button id="pc">取消</button><button class="primary" id="pa">加入 <span id="cnt">0</span> 個</button></div>`;

  d.querySelector('#pa').onclick=()=>{day.stops.push(...[...sel].filter(id=>!day.stops.includes(id)));save();d.close();render()};

function parseCSV(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!=='\r')f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()));
}
function importCSV(text,listName){
  const rows=parseCSV(text.replace(/^﻿/,''));if(!rows.length)return[];
  const h=rows[0].map(x=>x.trim().toLowerCase());
  const ix=k=>h.findIndex(x=>k.includes(x));
  const iT=ix(['title','name','名稱','標題']),iN=ix(['note','備註','附註']),iU=ix(['url','網址']),iC=ix(['comment','留言']);
  return rows.slice(1).map(r=>{const url=r[iU]||'',g=parseGmaps(url);const name=(r[iT]||g.name||'').trim();if(!name&&g.lat==null)return null;
    return{name:name||`${g.lat},${g.lng}`,url,lat:g.lat,lng:g.lng,note:[r[iN],r[iC]].filter(Boolean).join(' / '),tags:[listName],cat:guessCat(name)}}).filter(Boolean);
}
function importGeoJSON(text,listName){
  const j=JSON.parse(text);if(j.places&&j.trips)return'backup';
  return(j.features||[]).map(f=>{const pr=f.properties||{},loc=pr.location||{},co=f.geometry?.coordinates||[];
    const name=loc.name||pr.Title||pr.name||'';const g=parseGmaps(pr.google_maps_url||pr['Google Maps URL']||'');
    let lat=co[1],lng=co[0];if(!lat&&!lng){lat=g.lat;lng=g.lng}
    return name||lat?{name:name||g.name||`${lat},${lng}`,address:loc.address||'',url:pr.google_maps_url||'',lat:lat||undefined,lng:lng||undefined,note:pr.Comment||'',tags:[listName],cat:guessCat(name+' '+(loc.address||''))}:null}).filter(Boolean);
}
function importKML(text,listName){
  const x=new DOMParser().parseFromString(text,'text/xml');
  const docName=x.querySelector('Document > name')?.textContent?.trim()||listName;
  return[...x.getElementsByTagName('Placemark')].map(pm=>{
    const co=pm.getElementsByTagName('coordinates')[0]?.textContent.trim().split(/\s+/)[0].split(',');
    const folder=pm.parentElement?.tagName==='Folder'?pm.parentElement.getElementsByTagName('name')[0]?.textContent.trim():'';
    const name=pm.getElementsByTagName('name')[0]?.textContent.trim()||'';
    let desc=pm.getElementsByTagName('description')[0]?.textContent||'';desc=desc.replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'').trim();
    if(!co||co.length<2)return null;
    return{name:name||'未命名',lat:+co[1],lng:+co[0],note:desc,tags:[docName,folder].filter(Boolean),cat:guessCat(name+' '+folder),source:'mymaps'};
  }).filter(Boolean);
}
function mergePlaces(arr){
  let added=0,dup=0;
  arr.forEach(n=>{
    const ex=db.places.find(p=>(n.url&&p.url===n.url)||(p.name===n.name&&p.lat!=null&&n.lat!=null&&Math.abs(p.lat-n.lat)<1e-4&&Math.abs(p.lng-n.lng)<1e-4));
    if(ex){ex.tags=[...new Set([...(ex.tags||[]),...(n.tags||[])])];if(ex.lat==null&&n.lat!=null){ex.lat=n.lat;ex.lng=n.lng}dup++}
    else{if(n.lat==null||!isFinite(n.lat)){delete n.lat;delete n.lng}db.places.push({id:uid(),created:Date.now(),...n});added++}
  });
  save();return`新增 ${added} 個，合併重複 ${dup} 個`;
}

// ---------- 收藏：讀 Notion「旅記收藏」（經由 Google Apps Script 中繼服務） ----------
const INBOX_KEY='tripnote.inbox';
const ST_ALL=['待整理','已整理','已排入行程','封存'];
const ST_FILTERS=[['open','未完成'],['待整理','待整理'],['已整理','已整理'],['已排入行程','已排入'],['封存','封存'],['all','全部']];
let inboxCfg=(()=>{try{return JSON.parse(localStorage.getItem(INBOX_KEY))||{}}catch(e){return{}}})();
let inbox={tree:null,cards:null,loading:false,err:''},inboxAt=null,inboxSt='open';
async function inboxApi(method,path,body){
  // Apps Script 只接受 GET/POST，且不能處理預檢請求，所以一律用 text/plain 的 POST 包起來
  let r;
  try{r=await fetch(inboxCfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:inboxCfg.key,method,path,body})})}
  catch(e){throw new Error('連線失敗，請確認網址，以及部署時「誰可以存取」選了「所有人」')}
  const j=await r.json().catch(()=>null);
  if(!j)throw new Error('連線失敗 '+r.status+'，請確認網址是 /exec 結尾');
  if(!j.ok)throw new Error(j.error||'未知錯誤');return j.data;
}
// 收藏資料先存一份在手機：打開時立刻顯示上次的資料，背景再向 Notion 更新
const CACHE_KEY='tripnote.inboxCache';
(()=>{try{const c=JSON.parse(localStorage.getItem(CACHE_KEY));if(c&&c.url===inboxCfg.url&&c.tree&&c.cards){inbox.tree=c.tree;inbox.cards=c.cards}}catch(e){}})();
function saveInboxCache(){try{if(inbox.tree&&inbox.cards)localStorage.setItem(CACHE_KEY,JSON.stringify({url:inboxCfg.url,tree:inbox.tree,cards:inbox.cards}))}catch(e){}}
async function loadInbox(){
  if(inbox.loading)return;
  inbox.loading=true;inbox.err='';if(tab==='inbox'&&inbox.tree)render();
  try{const [t,c]=await Promise.all([inboxApi('GET','/tree'),inboxApi('GET','/cards')]);inbox.tree=t;inbox.cards=c;inbox.fresh=true;saveInboxCache()}
  catch(e){inbox.err=e.message;if(inbox.tree){inbox.fresh=true;toast('更新失敗，顯示的是上次的資料：'+e.message)}}
  inbox.loading=false;if(tab==='inbox')render();
}
const nodeById=id=>(inbox.tree||[]).find(n=>n.id===id);
const kidsOf=id=>(inbox.tree||[]).filter(n=>(n.parent||null)===id||(!id&&n.parent&&!nodeById(n.parent))).sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'));
function chainOf(id){const out=[],seen=new Set();for(let n=nodeById(id);n&&!seen.has(n.id);n=nodeById(n.parent)){seen.add(n.id);out.unshift(n)}return out}
const pathOf=id=>chainOf(id).map(n=>n.name).join(' › ');
function subtree(id){const out=new Set([id]);let grow=true;while(grow){grow=false;(inbox.tree||[]).forEach(n=>{if(n.parent&&out.has(n.parent)&&!out.has(n.id)){out.add(n.id);grow=true}})}return out}
const stOk=c=>inboxSt==='all'||(inboxSt==='open'?(c.status!=='已排入行程'&&c.status!=='封存'):c.status===inboxSt);
function cardsUnder(id){
  if(id==='none')return inbox.cards.filter(c=>!c.categoryId||!nodeById(c.categoryId)).filter(stOk);
  if(!id)return inbox.cards.filter(stOk);
  const ids=subtree(id);return inbox.cards.filter(c=>ids.has(c.categoryId)).filter(stOk);
}
async function patchCard(c,body){

}
// ---------- 預覽圖：壓縮成小 JPEG 再存進 Notion ----------
const IMG_W=720,IMG_H=1600,IMG_MAX=250*1024;
function loadImg(src){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('圖片讀取失敗'));i.src=src})}
const blobToDataUrl=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(b)});
async function compressImage(src){ // src：Blob 或 data URL；寬度縮到 720，太長的截圖只留上半部
  const url=typeof src==='string'?src:await blobToDataUrl(src),img=await loadImg(url);
  let scale=Math.min(1,IMG_W/img.naturalWidth),q=0.75,out;
  for(let i=0;i<6;i++){
    const w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.min(Math.round(img.naturalHeight*scale),IMG_H);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');
    cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(img,0,0,w,img.naturalHeight*scale);
    out=cv.toDataURL('image/jpeg',q);if(out.length*3/4<=IMG_MAX)break;
    if(q>0.55)q-=0.1;else scale*=0.8;
  }
  return {type:'image/jpeg',b64:out.split(',')[1],url:out};
}
function pickImageFile(){return new Promise(ok=>{const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>ok(f.files[0]||null);f.click()})}
async function pasteImage(){
  if(!navigator.clipboard||!navigator.clipboard.read)throw new Error('這個瀏覽器不能讀剪貼簿，請改用「從相簿選」');
  for(const it of await navigator.clipboard.read()){const t=it.types.find(x=>x.startsWith('image/'));if(t)return await it.getType(t)}
  throw new Error('剪貼簿裡沒有圖片');
}
async function fetchPreview(url){ // 網站預覽圖：由 Apps Script 代抓，再在這裡壓縮
  const meta=await inboxApi('POST','/meta',{url});if(!meta.image)throw new Error('這個網頁沒有預覽圖');
  const r=await inboxApi('POST','/image',{url:meta.image});return compressImage('data:'+r.type+';base64,'+r.b64);
}
async function cardImage(c){

// ---------- 儲存分享：捷徑打開 ?share={url,text,ocr} → 選分類 → 建立 Notion 卡片 ----------
const LASTCAT_KEY='tripnote.lastCat';
let share=null; // {url,text,ocr,meta,title,source,sel,open:Set,img,imgBusy}
function shareSource(url,ocr){
  if(!url)return ocr?'截圖':'其他';const h=url.toLowerCase();
  if(/instagram\.com/.test(h))return'Instagram';if(/threads\.(net|com)/.test(h))return'Threads';
  if(/youtube\.com|youtu\.be|tiktok\.com|vimeo\.com/.test(h))return'影片';return'網頁';
}
const firstLineOf=s=>{const l=String(s||'').split(/\r?\n/).map(x=>x.trim()).find(Boolean)||'';return l.length>80?l.slice(0,80)+'…':l};
// 路徑分數：根到節點的路徑上有幾個節點的關鍵字出現在文字裡；同分取較深者
function suggestCat(hay){
  const t=String(hay||'').toLowerCase(),tree=inbox.tree||[];
  const kw=n=>[n.name,...String(n.keywords||'').split(/[,，、]/)].map(k=>k.trim().toLowerCase()).filter(Boolean);
  const hit=new Set(tree.filter(n=>kw(n).some(k=>t.includes(k))).map(n=>n.id));
  let best=[],bs=0,bd=0;
  tree.forEach(n=>{if(!hit.has(n.id))return;const c=chainOf(n.id),sc=c.filter(x=>hit.has(x.id)).length,d=c.length;
    if(sc>bs||(sc===bs&&d>bd)){best=[n];bs=sc;bd=d}else if(sc===bs&&d===bd)best.push(n)});
  return best.length===1?best[0].id:null;
}
function startShare(raw){
  // 捷徑可以帶 gas（Apps Script 網址）和 key（APP_KEY），這樣 Safari 不用手動連線
  const gas=String(raw.gas||'').trim(),key=String(raw.key||'').trim();
  if(GAS_RE.test(gas)&&key&&(gas!==inboxCfg.url||key!==inboxCfg.key))saveInboxCfg(gas,key);
  const url=(String(raw.url||'').match(/https?:\/\/[^\s<>"']+/)||String(raw.text||'').match(/https?:\/\/[^\s<>"']+/)||[''])[0];
  share={url,text:String(raw.text||''),ocr:String(raw.ocr||''),meta:null,sel:undefined,open:new Set()};
  share.source=shareSource(url,share.ocr);tab='inbox';
}
// ---------- 店名辨識（規則版，不用 AI） ----------
// 依序找：Google 地圖地點名、📍/📌 後面的名稱、「店名：」這類標籤、「」『』括起來的名稱
const ADDR_RE=/\d+\s*(號|樓|F\b)|[路街道巷弄段]\s*\d|^\s*(台|臺)?(北|中|南)?[^\s]{0,4}[市縣區鄉鎮]\S*[路街道]|〒|\d{3}-\d{4}|\d+-\d+|[都府県区]\S*\d|丁目|番地/i;
const NOT_NAME=/^(地址|營業時間|時間|電話|價位|價格|預算|交通|停車|公休|休息|官網|訂位|IG|FB|捷運|MRT)/i;
function cleanName(x){
  let t=String(x||'').replace(/#[^\s#]+/g,'').replace(/@[\w.]+/g,'').replace(/https?:\/\/\S+/g,'')
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,' ').replace(/^[\s:：\-–—｜|·•,，、。.]+|[\s:：\-–—｜|·•,，、。.!！~～]+$/g,'').replace(/\s+/g,' ').trim();
  return t.length>=2&&t.length<=40&&!NOT_NAME.test(t)&&!ADDR_RE.test(t)&&!/^\d+$/.test(t)?t:'';
}
// 「店名｜地址」「台北｜店名」這種用分隔符號串起來的，取不是地址、不是單純地名的那段
function pickPart(line){
  const parts=String(line).split(/\s*[｜|／/]\s*|\s+[-–—]\s+/).map(cleanName).filter(Boolean);
  return parts.find(x=>!/^(台|臺)?[\u4e00-\u9fff]{1,3}[市縣區]?$/.test(x)||parts.length===1)||'';
}
function storeCandidates(){
  const m=share.meta||{},texts=[m.description,share.text,share.ocr,m.title].map(x=>String(x||'')),all=texts.join('\n'),out=[];
  const add=x=>{x=cleanName(x);if(x&&!out.some(o=>o.toLowerCase()===x.toLowerCase()))out.push(x)};
  if(/google\.[^/]+\/maps|maps\.app\.goo\.gl|goo\.gl\/maps/i.test(share.url)){
    add(String(m.title||'').replace(/\s*[-·]\s*Google\s*(地圖|Maps).*$/i,'').split(/\s+·\s+/)[0]);
    add(firstLineOf(share.text.replace(share.url,'')));
  }
  for(const mm of all.matchAll(/(?:📍|📌|🏠|🏪|🍴|☕️?|🍜|🍰)\s*(?:店名|店家|餐廳|地點|名稱)?\s*[:：]?\s*([^\n]+)/gu))add(pickPart(mm[1]));
  for(const mm of all.matchAll(/(?:店名|店家|餐廳|店鋪|店舖|名稱|Shop|Store|Restaurant|Cafe)\s*[:：｜|]\s*([^\n]+)/gi))add(pickPart(mm[1]));
  for(const mm of all.matchAll(/[「『]([^」』\n]{2,30})[」』]/g))add(mm[1]);
  // 【店名】，但略過「【台北美食】」這類標題
  for(const mm of all.matchAll(/【([^】\n]{2,30})】/g))if(!/美食|推薦|必吃|攻略|懶人包|分享|開箱|食記|遊記|旅遊|景點|咖啡廳$|餐廳$/.test(mm[1]))add(mm[1]);
  // 「台北｜店名」「京都・店名」這種開頭寫法
  for(const t of texts){const l=firstLineOf(t);if(/^[^｜|・]{1,6}\s*[｜|・]\s*\S/.test(l))add(pickPart(l))}
  return out.slice(0,4);
}
function shareTitleGuess(){return share.title??((share.stores&&share.stores[0])||share.meta&&share.meta.title||firstLineOf(share.text.replace(share.url,''))||firstLineOf(share.ocr)||share.url||'未命名收藏')}
// 分類樹先顯示（用分享文字比對），網頁標題抓回來後再更新建議；使用者已經點過分類就不改
function suggestShare(){
  share.stores=storeCandidates();
  const m=share.meta||{},sug=suggestCat([m.title,m.description,share.text,share.ocr,share.url].join('\n'));
  let last=share.last;if(last===undefined){try{last=localStorage.getItem(LASTCAT_KEY)}catch(e){last=null}}
  if(last&&!nodeById(last))last=null;
  share.sug=sug;share.last=last;if(!share.picked)share.sel=sug||last||null;

}

      .finally(()=>{s.imgBusy=false;if(share===s&&tab==='inbox')render()})}

  ${(share.stores||[]).length>1||(share.stores||[]).length===1&&share.title!=null&&share.title!==share.stores[0]?`<div class="chips" style="margin-top:6px"><span class="meta">店名候選：</span>${share.stores.map((x,i)=>`<button class="chip" data-store="${i}">${esc(x)}</button>`).join('')}</div>`:''}
  <div class="meta" style="margin-top:4px">${esc(share.source)}${share.url?' · '+esc(share.url.length>60?share.url.slice(0,60)+'…':share.url):''}</div>
  <label>分類</label><div class="card" style="padding:4px 0">${kidsOf(null).map(n=>row(n,0)).join('')||'<div class="empty">分類樹是空的</div>'}</div>
  <div class="row"><button class="sm" id="sh_add">${share.sel?'＋在「'+esc(nodeById(share.sel).name)+'」底下新增':'＋新增最上層分類'}</button><span class="grow"></span>
  <button class="sm" id="sh_none">先不分類</button></div>
  <button class="primary" id="sh_save" style="width:100%;justify-content:center;margin-top:14px;padding:12px" ${share.sel?'':'disabled'}>${share.sel?'存到「'+esc(selPath)+'」':'請點選一個分類'}</button>`;
  const $=id=>document.getElementById(id);
  $('sh_title').oninput=()=>{share.title=$('sh_title').value};
  V().querySelectorAll('[data-store]').forEach(b=>b.onclick=()=>{share.title=share.stores[+b.dataset.store];render()});
  const setImg=async get=>{const s=share;try{const b=await get();if(b){s.img=await compressImage(b);if(share===s)render()}}catch(e){toast(e.message)}};
  if($('sh_paste'))$('sh_paste').onclick=()=>setImg(pasteImage);
  if($('sh_pick'))$('sh_pick').onclick=()=>setImg(pickImageFile);
  if($('sh_rm'))$('sh_rm').onclick=()=>{share.img=null;render()};
  V().querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{const id=b.dataset.tog;share.open.has(id)?share.open.delete(id):share.open.add(id);render()});
  V().querySelectorAll('[data-sel]').forEach(el=>el.onclick=()=>{const id=el.dataset.sel;share.sel=id;share.picked=true;if(kidsOf(id).length)share.open.add(id);render()});
  $('sh_add').onclick=async()=>{
    const par=share.sel?nodeById(share.sel):null,name=(prompt(par?`在「${par.name}」底下新增分類，名稱：`:'新增最上層分類，名稱：')||'').trim();if(!name)return;
    const keywords=(prompt('關鍵字（逗號分隔，可留空）','')||'').trim();
    try{const n=await inboxApi('POST','/tree',{name,keywords,parent:par?par.id:null});inbox.tree.push(n);if(par)share.open.add(par.id);share.sel=n.id;share.picked=true;render()}catch(e){toast('新增失敗：'+e.message)}
  };
  const doSave=async cat=>{
    const btn=$('sh_save');btn.disabled=true;btn.textContent='儲存中…';
    try{
      const c=await inboxApi('POST','/cards',{title:$('sh_title').value.trim()||shareTitleGuess(),source:share.source,url:share.url,categoryId:cat,
        image:share.img?{type:share.img.type,b64:share.img.b64}:undefined});
      if(cat)try{localStorage.setItem(LASTCAT_KEY,cat)}catch(e){}
      if(inbox.cards)inbox.cards.unshift(c);
      share=null;inboxAt=cat||'none';inboxSt='open';toast('已存到收藏'+(cat?'：'+pathOf(cat):''));render();
    }catch(e){toast('儲存失敗：'+e.message);btn.disabled=false;btn.textContent='再試一次'}
  };
  $('sh_save').onclick=()=>share.sel&&doSave(share.sel);
  $('sh_none').onclick=()=>doSave(null);
}

// share-target style: ?url=... adds a place directly (useful from iOS Shortcuts)
function parseShare(sh){const m=location.search.match(/[?&]share=([^&]*)/);let raw=sh;try{if(m)raw=decodeURIComponent(m[1])}catch(e){}
try{return JSON.parse(raw)}catch(e){}
try{const b=raw.replace(/\s/g,'').replace(/-/g,'+').replace(/_/g,'/'),bin=atob(b+'==='.slice((b.length+3)%4)),u=Uint8Array.from(bin,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(u))}catch(e){}
return {text:sh}}
(()=>{const p=new URLSearchParams(location.search),sh=p.get('share');if(sh){history.replaceState(null,'',location.pathname);startShare(parseShare(sh));return}const u=p.get('url')||p.get('text');if(u){history.replaceState(null,'',location.pathname);setTimeout(()=>{editPlace();const f=document.getElementById('f_url');f.value=u;f.oninput()},50)}})();
render();
</script>
